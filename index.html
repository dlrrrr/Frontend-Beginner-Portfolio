<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital@0;1&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

</head>
<body>
    <div class="main-block">
        <div class="photo-block">
            <img src="images/image-product-desktop.jpg" alt="Desktop Image" class="desktop-img">
            <img src="images/image-product-mobile.jpg" alt="Mobile Image" class="mobile-img">
        </div>
        <div class="text-block">
            <p class="perfume">Perfume</p>
            <h1>Gabrielle Essence Eau De Parfum</h1>
            <p class="desc">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>
            <div class="prices">
                <p class="price-new">$149.99</p>
                <p class="price-old">$169.99</p>
            </div>
            <button class="btn-add">
                <img src="images/icon-cart.svg" alt="">
                <p>Add to Cart</p>
            </button>
        </div>
    </div>
</body>
</html>
